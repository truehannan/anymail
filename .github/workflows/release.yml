name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release secrets
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          failed=0
          for name in KEYSTORE_FILE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            value="${!name:-}"
            normalized="${value,,}"
            if [ -z "$value" ] \vert{}\vert{} [[ "$normalized" =~ placeholder|changeme|yourdomain|example\.com ]]; then
              echo "::error::Required release secret $name is missing or contains a placeholder."
              failed=1
            fi
          done
          exit "$failed"

      - name: Create release configuration
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_FILE_BASE64" | base64 --decode > app/monomail-release.keystore
          {
            printf 'storeFile=app/monomail-release.keystore\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          {
            printf 'GOOGLE_CLIENT_ID=dummy-client-id.apps.googleusercontent.com\n'
            printf 'PUSH_BACKEND_URL=https://dummy-push-backend.workers.dev\n'
          } > secrets.properties
          mkdir -p app/src/playstore
          echo "e30=" | base64 --decode > app/src/playstore/google-services.json
          test -s app/monomail-release.keystore

      - name: Resolve next immutable version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base_sha=$(git rev-parse HEAD)
          version=$(sed -n 's/.*versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts)
          version_code=$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)
          IFS=. read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          if [ "$patch" -ge 100 ]; then
            patch=0
            minor=$((minor + 1))
          fi
          next_version="$major.$minor.$patch"
          next_version_code=$((version_code + 1))
          tag="v$next_version"

          test -n "$version" && test -n "$version_code"
          if git show-ref --verify --quiet "refs/tags/$tag" || \
             git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || \
             gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Tag or release $tag already exists; refusing to overwrite immutable release state."
            exit 1
          fi

          sed -i "s/versionCode = $version_code/versionCode =$next_version_code/" app/build.gradle.kts
          sed -i "s/versionName = \"$version\"/versionName = \"$next_version\"/" app/build.gradle.kts
          {
            echo "base_sha=$base_sha"
            echo "previous_version=$version"
            echo "version=$next_version"
            echo "version_code=$next_version_code"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

      - name: Validate Android and build signed release artifacts
        run: >-
          ./gradlew
          testGithubDebugUnitTest
          assembleGithubRelease
          --stacktrace

      - name: Prepare immutable artifacts and release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          cp app/build/outputs/apk/github/release/app-github-release.apk "release-artifacts/MonoMail-$TAG.apk"
          (cd release-artifacts && sha256sum * > SHA256SUMS)

          previous_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$previous_tag" ]; then
            range="$previous_tag..${{ steps.version.outputs.base_sha }}"
          else
            range="${{ steps.version.outputs.base_sha }}"
          fi
          git log "$range" --pretty=format:'- %s' --no-merges \
            --invert-grep --grep='^chore: bump version' > release_notes.md
          if [ ! -s release_notes.md ]; then
            printf '%s\n' '- No user-facing changes.' > release_notes.md
          fi
          {
            printf '%s\n\n' "## What's Changed"
            cat release_notes.md
          } > release_notes.full.md
          mv release_notes.full.md release_notes.md

      - name: Commit and atomically publish version tag
        env:
          BASE_SHA: ${{ steps.version.outputs.base_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "chore: bump version to $VERSION [skip ci]"
          git diff --exit-
